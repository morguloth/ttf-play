:root {
  --label: 'Cinzel', 'Barlow Condensed', serif;
  --body: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --lab: #c9a764; --sub: #b9ab8f; --ink-hi: #f1dfb2; --ink-mid: #cdbf9f;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 48px 16px 40px; overflow-x: hidden; position: relative; font-variant-numeric: lining-nums;
  font-family: var(--body); color: #f2e7cf; background: #080706; }
/* the torchlight and the warm dust (loop001 title screen) */
.glow { position: fixed; left: 50%; top: 44%; width: 1160px; height: 760px; max-width: 200vw; transform: translate(-50%, -50%); pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse at center, rgba(224,172,92,.17) 0%, rgba(150,100,50,.07) 38%, transparent 68%); }
.motes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.motes i { position: absolute; bottom: 40px; width: var(--s, 4px); height: var(--s, 4px); border-radius: 50%; opacity: 0;
  background: radial-gradient(circle, rgba(255,222,150,.95) 0%, rgba(255,190,100,.5) 45%, rgba(255,170,80,0) 72%);
  animation: mote var(--t, 18s) linear var(--md, 0s) infinite; }
@keyframes mote { 0% { opacity: 0; transform: translate3d(0,0,0); } 12% { opacity: .75; } 80% { opacity: .45; } 100% { opacity: 0; transform: translate3d(var(--dx, 20px), -560px, 0); } }
main { position: relative; z-index: 1; width: 100%; max-width: 760px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.kick { font-family: var(--label); font-weight: 700; font-size: 15px; letter-spacing: 4px; text-transform: uppercase; color: var(--lab);
  display: flex; align-items: center; gap: 14px; }
.kick::before, .kick::after { content: ''; width: 46px; height: 1px; background: linear-gradient(90deg, transparent, rgba(201,167,100,.7)); }
.kick::after { transform: scaleX(-1); }
h1 { margin: 14px 0 0; font-family: var(--label); font-weight: 700; font-size: clamp(40px, 9.5vw, 84px); letter-spacing: .08em; line-height: 1.1; text-transform: uppercase; white-space: nowrap;
  background: linear-gradient(180deg, #fff6d6 10%, #f2c86a 55%, #b9832e 92%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 34px rgba(243,200,110,.35)) drop-shadow(0 4px 0 #000); }
.invite { margin: 22px 0 34px; font-size: 24px; color: var(--ink-mid); letter-spacing: .5px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
/* a version: the game's dark panel with its brass rim */
.opt { position: relative; width: 100%; display: flex; align-items: center; gap: 22px; padding: 20px 22px 20px 24px; margin-bottom: 22px; border-radius: 12px; text-align: left;
  color: inherit; text-decoration: none; -webkit-tap-highlight-color: transparent;
  background: linear-gradient(180deg, rgba(58,48,38,.96), rgba(31,26,21,.97));
  box-shadow: inset 0 0 0 1px rgba(255,226,160,.10), 0 0 0 1px #0c0a08, 0 0 0 3px #6e5532, 0 0 0 4px #1a140e, 0 16px 30px -10px rgba(0,0,0,.95);
  transition: transform 110ms ease, filter 140ms ease; }
.opt::before { content: ''; position: absolute; inset: 5px; border-radius: 8px; border: 1px solid rgba(214,177,104,.22); pointer-events: none; }
.opt:active { transform: translateY(2px); }
.opt:focus-visible { outline: 3px solid #e2bf72; outline-offset: 4px; }
@media (hover: hover) { .opt:hover { filter: brightness(1.08); } }
.txt { flex: 1; min-width: 0; }
.nm { display: flex; align-items: center; gap: 12px; font-family: var(--label); font-weight: 700; font-size: 30px; letter-spacing: 1px; line-height: 1.1; color: #f6e6c0; }
.new { padding: 3px 10px 2px; border-radius: 999px; font-family: var(--label); font-weight: 700; font-size: 13px; letter-spacing: 2px; color: #fff1dc;
  background: linear-gradient(180deg, #c04b3e, #7e2a22); box-shadow: 0 0 0 1px #0c0a08; }
.ln { margin-top: 6px; font-size: 20px; line-height: 1.2; color: var(--sub); }
.meta { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
.pips { display: flex; gap: 6px; }
.pip { width: 16px; height: 16px; border-radius: 50%; box-shadow: 0 0 0 1.5px #0c0a08, inset 0 1px 0 rgba(255,255,255,.35); }
.pip.inf { background: #c4573f; } .pip.arc { background: #66a04b; } .pip.cav { background: #4f7fc2; } .pip.mac { background: #d3b085; }
.ver { font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(185,171,143,.6); }
/* Play: the game's brass go button */
.go { flex: none; display: flex; align-items: center; justify-content: center; width: 168px; height: 64px; border-radius: 12px;
  font-family: var(--label); font-weight: 700; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; color: #fff4de; text-shadow: 0 1px 2px rgba(40,22,4,.75);
  background: linear-gradient(180deg, #cfa857, #9c7433 55%, #6c4c1d);
  box-shadow: inset 0 1px 0 rgba(255,246,214,.5), inset 0 -2px 0 rgba(40,22,4,.35), 0 0 0 1px #0c0a08, 0 0 0 3px #e2bf72, 0 0 0 4px #1a140e,
    0 0 24px 2px rgba(243,213,142,.28), 0 16px 26px -8px rgba(0,0,0,.95); }
.foot { margin-top: 10px; font-size: 15px; letter-spacing: .4px; color: rgba(185,171,143,.5); }
@media (max-width: 560px) {
  body { padding: 40px 16px 28px; }
  .kick { font-size: 13px; letter-spacing: 3px; } .kick::before, .kick::after { width: 26px; }
  h1 { font-size: 8.4vw; letter-spacing: .04em; }
  .invite { font-size: 20px; margin: 16px 0 26px; }
  .opt { flex-direction: column; align-items: stretch; gap: 16px; padding: 18px 18px 20px; }
  .nm { font-size: 25px; }
  .ln { font-size: 18px; }
  .go { width: 100%; height: 58px; }
}
@media (prefers-reduced-motion: reduce) { .motes { display: none; } }
</style>
</head>

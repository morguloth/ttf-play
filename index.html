  function officerOf(o) {
    if (!o) return null;
    if (typeof o === 'string') return { type: o, shape: 'cross' };
    return { type: o.type, shape: SHAPES[o.shape] ? o.shape : 'cross' };
  }
  /** The cells of `shape` for an officer at `slot` (ascending, never `slot`). */
  const shapeCells = (shape, slot) => (SHAPES[shape] || SHAPES.cross)[slot].slice();

  const LINES = [];
  for (let k = 0; k < N; k++) {
    const row = [], col = [];
    for (let j = 0; j < N; j++) { row.push(k * N + j); col.push(j * N + k); }
    LINES.push(row, col);
  }
  const SQUARES = [];
  for (let y = 0; y < N - 1; y++)
    for (let x = 0; x < N - 1; x++) { const a = y * N + x; SQUARES.push([a, a + 1, a + N, a + N + 1]); }

  // ---- evaluation ---------------------------------------------------------
  const P_CACHE = new WeakMap(); // pieces object (immutable) -> array of 16
  function toArr(pieces) {
    let P = P_CACHE.get(pieces);
    if (!P) {
      P = new Array(S).fill(null);
      for (const k in pieces) P[+k] = pieces[k];
      P_CACHE.set(pieces, P);
    }
    return P.slice();
  }
  const CHEB = {};
  const chebOf = (i, r) => (CHEB[r] || (CHEB[r] = Array.from({ length: S }, (_, k) => cheb(k, r))))[i];
  const cheb1 = (i, j) => Math.max(Math.abs(i % N - j % N), Math.abs(((i / N) | 0) - ((j / N) | 0)));
  const heroRadius = (T, g) => (g === 'warden' ? T.general.warden : T.hero.radius);
  const TI = { inf: 0, arc: 1, cav: 2 };

  const SCRATCH_PT = new Float64Array(PARTS.length * S), SCRATCH_TY = new Int8Array(S);

  /**
   * Core evaluator. P: array of 16 pieces (or null). Returns per-slot values
   * (null where empty or a lone post), flat parts (part k of slot i at k*16+i)
   * and, when asked, the completed combos. `totalOnly` (policy fast path)
   * reuses scratch buffers and returns just the number.
   */
  function evaluate(board, P, g, T, wantCombos, totalOnly) {
    const pt = totalOnly ? SCRATCH_PT.fill(0) : new Float64Array(PARTS.length * S);
    const combos = wantCombos ? [] : null;
    const ty = (totalOnly ? SCRATCH_TY : new Int8Array(S)).fill(-1); // unit type index, -1 empty, post or hero
    for (let i = 0; i < S; i++) {
      const p = P[i];
      if (!p || p.kind === 'post') continue;
      if (p.kind === 'hero') { pt[i] = T.hero.power; continue; }
      ty[i] = TI[p.type];
      pt[i] = T.unit.base;
      const terr = board[i].terrain, tt = T.terrain.table[terr] || {};
      if (tt.love === p.type) pt[S + i] = T.terrain.love;
      else if (tt.hate === p.type) pt[S + i] = (g === 'ranger' && p.type === 'arc') ? 0 : T.terrain.hate;
      if (g === 'horse_lord' && p.type === 'cav' && terr === 'plains') pt[6 * S + i] = T.general.horse_lord;
      if (g === 'ranger' && p.type === 'arc' && tt.love === 'arc') pt[6 * S + i] = T.general.ranger;
    }
    // Lines: maximal same-type runs of >= lineLen along rows and columns.
    const lineV = g === 'iron_marshal' ? T.general.iron_marshal : T.combo.line;
    for (const L of LINES) {
      let a = 0;
      while (a < N) {
        const t = ty[L[a]];
        if (t < 0) { a++; continue; }
        let b = a + 1;
        while (b < N && ty[L[b]] === t) b++;
        if (b - a >= T.combo.lineLen) {
          for (let k = a; k < b; k++) pt[2 * S + L[k]] = lineV;
          if (combos) combos.push({ kind: 'line', type: TYPES[t], slots: L.slice(a, b) });
        }
        a = b;
      }
    }
    // Triads: one of each type inside a 2x2 square (pairwise 8-adjacent).
    const triV = g === 'tactician' ? T.general.tactician : T.combo.triad;
    const seen = {};
    for (const sq of SQUARES) {
      let mask = 0;
      for (const s of sq) if (ty[s] >= 0) mask |= 1 << ty[s];
      if (mask !== 7) continue;
      for (const s of sq) if (ty[s] >= 0) pt[3 * S + s] = triV;
      if (!combos) continue;
      const by = [[], [], []];
      for (const s of sq) if (ty[s] >= 0) by[ty[s]].push(s);
      for (const a of by[0]) for (const b of by[1]) for (const c of by[2]) {
        const slots = [a, b, c].sort((u, v) => u - v), key = slots.join(',');
        if (!seen[key]) { seen[key] = 1; combos.push({ kind: 'triad', slots }); }
      }
    }
    // Officers (on a host or on a post): a host gets +host; every unit of the
    // officer's type inside its shape gets +adj (Captain: both are general.captain).
    const hostV = g === 'captain' ? T.general.captain : T.officer.host;
    const adjV = g === 'captain' ? T.general.captain : T.officer.adj;
    for (let i = 0; i < S; i++) {
      const o = P[i] && P[i].officer ? officerOf(P[i].officer) : null;
      if (!o) continue;
      if (ty[i] >= 0) pt[4 * S + i] += hostV;
      const ot = TI[o.type];
      for (const j of SHAPES[o.shape][i]) if (ty[j] === ot) pt[4 * S + j] += adjV;
    }
    // Heroes: ring bonus, larger when the ring holds the formation. Warden: the
    // ring reaches general.warden; units beyond hero.radius get general.wardenFar
    // flat (0 = the same bonus as the inner ring).
    const r = heroRadius(T, g), far = g === 'warden' ? T.general.wardenFar : 0;
    for (let i = 0; i < S; i++) {
      if (!P[i] || P[i].kind !== 'hero') continue;
      const ring = chebOf(i, r), cnt = [0, 0, 0];
      for (const j of ring) if (ty[j] >= 0) cnt[ty[j]]++;
      const cond = P[i].cond || {};
      const bonus = TYPES.every((t, k) => cnt[k] >= (cond[t] || 0)) ? T.hero.ringMet : T.hero.ring;
      for (const j of ring) if (ty[j] >= 0) pt[5 * S + j] += (far && cheb1(i, j) > T.hero.radius) ? far : bonus;
    }
    const values = totalOnly ? null : new Array(S).fill(null);
    let total = 0;
    for (let i = 0; i < S; i++) {
      if (!P[i] || P[i].kind === 'post') continue;
      let v = 0;
      for (let k = 0; k < PARTS.length; k++) v += pt[k * S + i];
      v = v > 0 ? v : 0;
      if (values) values[i] = v;
      total += v;
    }
    return totalOnly ? total : { values, pt, total, combos };
  }

  const evalState = (st, combos) => evaluate(st.board, toArr(st.pieces), st.general, tunOf(st), combos);

  function partsOf(ev, i) {
    const o = {};
    PARTS.forEach((k, n) => { o[k] = ev.pt[n * S + i]; });
    return o;
  }
  function mapOf(ev) {
    const m = {};
    for (let i = 0; i < S; i++) if (ev.values[i] !== null) m[i] = { value: ev.values[i], parts: partsOf(ev, i) };
    return m;
  }

  // ---- pieces, legality, offers -------------------------------------------
  function pieceOf(card) {
    const p = card.kind === 'hero' ? { kind: 'hero', id: card.id, cond: card.cond } : { kind: 'unit', type: card.type };
    if (card.uid !== undefined) p.uid = card.uid;
    return p;
  }
  /** The officer record a piece keeps: {uid?, type, shape}. */
  function officerRec(card) {
    const o = officerOf(card);
    if (card.uid !== undefined) o.uid = card.uid;
    return o;
  }
  /** The piece at a slot once `card` is put there (`prev` = what stood there). */
  function newPiece(prev, card) {
    if (card.kind === 'officer') {
      if (prev) return Object.assign({}, prev, { officer: officerRec(card) });
      const post = { kind: 'post', officer: officerRec(card) };
      if (card.uid !== undefined) post.uid = card.uid;
      return post;
    }
    const p = pieceOf(card);
    if (prev && prev.kind === 'post') p.officer = prev.officer;
    return p;
  }
  /** New pieces object with `card` put at `slot`. */
  function putPiece(pieces, card, slot) {
    const out = Object.assign({}, pieces);
    out[slot] = newPiece(pieces[slot], card);
    return out;
  }

  /** §7.1: officer -> empty slots and units without an officer; unit -> empty slots and posts; hero -> empty slots. */
  function legalSlots(st, card) {
    if (!st || st.phase !== 'draft' || !card) return [];
    const out = [];
    for (let i = 0; i < S; i++) {
      const p = st.pieces[i];
      const ok = !p ? true
        : card.kind === 'officer' ? (p.kind === 'unit' && !p.officer)
        : card.kind === 'unit' ? p.kind === 'post'
        : false;
      if (ok) out.push(i);
    }
    return out;
  }

  /** Fill the offer from the top of the deck (officers are always placeable since §7.1). */
  function drawOffer(deck, n) {
    const d = deck.slice();
    return { offer: d.splice(0, n), deck: d };
  }

  // ---- public API ---------------------------------------------------------
  function createBattle(opts) {
    const o = opts || {};
    const T = o.tun || C.TUN_DEFAULT;
    const seed = o.seed === undefined || o.seed === null || o.seed === '' ? (Math.random() * 4294967296) >>> 0 : o.seed;
    const gens = C.RNG.shuffle(C.RNG.seedFrom(seed, 'generals'), C.GENERALS.map((g) => g.id)).value;
    const heroes = C.RNG.shuffle(C.RNG.seedFrom(seed, 'heroes'), heroPool(T)).value.slice(0, T.deck.heroes);
    // §7.2: one officer per entry of deck.officers; shapes drawn by the seed from
    // officerShapes with no repeat (a pool shorter than the officer list wraps).
    let pool = (T.officerShapes || ['cross']).filter((x) => SHAPES[x]);
    if (!pool.length) pool = ['cross'];
    const shapes = C.RNG.shuffle(C.RNG.seedFrom(seed, 'officerShapes'), pool).value;
    return {
      phase: 'setup', seed, tier: o.tier || 'normal', tun: T,
      board: C.generateBoard(seed, T),
      generalOffer: gens.slice(0, T.generalOffer),
      heroes: heroes.map((h) => ({ id: h.id, cond: Object.assign({}, h.cond) })),
      officers: T.deck.officers.map((type, k) => ({ type, shape: shapes[k % shapes.length] })),
      general: null, army: null, deck: [], offer: [], pieces: {}, turn: 0, prev: null
    };
  }

  /** The battle's full card list for an army (unshuffled, uids assigned). */
  function cardsFor(st, armyId) {
    const T = tunOf(st), army = armies(T).find((a) => a.id === armyId);
    if (!army) throw new Error('unknown army ' + armyId);
    const cards = [];
    for (const t of TYPES) for (let k = 0; k < (army.mix[t] || 0); k++) cards.push({ kind: 'unit', type: t });
    const offs = st.officers || T.deck.officers.map((type) => ({ type, shape: 'cross' }));
    for (const o of offs) cards.push({ kind: 'officer', type: o.type, shape: o.shape });
    for (const h of st.heroes) cards.push({ kind: 'hero', id: h.id, cond: Object.assign({}, h.cond) });
    return cards.map((c, uid) => Object.assign({ uid }, c));
  }

  function chooseSetup(st, choice) {
    if (st.phase !== 'setup') throw new Error('not in setup');
    const { general, army } = choice || {};
    if (st.generalOffer.indexOf(general) < 0) throw new Error('general not offered: ' + general);
    const T = tunOf(st);
    const deck = C.RNG.shuffle(C.RNG.seedFrom(st.seed, 'deck', army), cardsFor(st, army)).value;
    const d = drawOffer(deck, T.offerSize);
    return Object.assign({}, st, { phase: 'draft', general, army, deck: d.deck, offer: d.offer, pieces: {}, turn: 0, prev: null });
  }

  /** Sim helper: the same draft state with its deck replaced by `cards` (top first) and the offer redrawn. */
  function redeal(st, cards) {
    const d = drawOffer(cards, tunOf(st).offerSize);
    return Object.assign({}, st, { deck: d.deck, offer: d.offer });
  }

  const canPick = (st, card) => legalSlots(st, card).length > 0;

  function place(st, oi, slot) {
    if (!st || st.phase !== 'draft') throw new Error('not in draft');
    const card = st.offer[oi];
    if (!card) throw new Error('no offer card ' + oi);
    if (legalSlots(st, card).indexOf(slot) < 0) throw new Error('illegal slot ' + slot + ' for ' + card.kind);
    const T = tunOf(st);
    const pieces = putPiece(st.pieces, card, slot);
    const deck = st.deck.concat(st.offer.filter((_, k) => k !== oi));
    const turn = st.turn + 1;
    if (turn >= T.turns) return Object.assign({}, st, { phase: 'done', pieces, deck, offer: [], turn, prev: st });
    const d = drawOffer(deck, T.offerSize);
    return Object.assign({}, st, { pieces, deck: d.deck, offer: d.offer, turn, prev: st });
  }

  const valueMap = (st) => mapOf(evalState(st, false));
  const total = (st) => evaluate(st.board, toArr(st.pieces), st.general, tunOf(st), false, true);
  const combosOf = (st) => evalState(st, true).combos;

  /** Fast path for policies: the total after placing offer card `oi` at `slot` (no legality check). */
  function totalAfter(st, oi, slot) {
    const P = toArr(st.pieces);
    P[slot] = newPiece(P[slot], st.offer[oi]);
    return evaluate(st.board, P, st.general, tunOf(st), false, true);
  }

  function comboKey(c) { return c.kind + ':' + (c.type || '') + ':' + c.slots.join(','); }

  /** Empty slots and posts (a unit may take either) x each type that would complete a combo there. */
  function partialCombos(st) {
    const out = [], P = toArr(st.pieces), T = tunOf(st);
    for (let i = 0; i < S; i++) {
      const was = P[i];
      if (was && was.kind !== 'post') continue;
      for (const t of TYPES) {
        P[i] = { kind: 'unit', type: t };
        const kinds = {};
        for (const c of evaluate(st.board, P, st.general, T, true).combos)
          if (c.slots.indexOf(i) >= 0) kinds[c.kind] = 1;
        for (const kind of Object.keys(kinds)) out.push({ slot: i, type: t, kind });
      }
      P[i] = was;
    }
    return out;
  }

  function heroArea(st, slot, general) {
    const g = general === undefined ? st.general : general;
    return chebOf(slot, heroRadius(tunOf(st), g)).slice();
  }

  /**
   * §7.2: the shape cells of the officer at `slot` - the one standing there (on a post
   * or a host), or `officer` when given (a card, {type, shape} or a type string), e.g.
   * to preview a card before it is placed. [] when there is no officer. Never has `slot`.
   */
  function officerArea(st, slot, officer) {
    const p = st && st.pieces ? st.pieces[slot] : null;
    const o = officerOf(officer || (p && p.officer));
    return o ? shapeCells(o.shape, slot) : [];
  }

  /**
   * §7.3: the formation of the hero at `heroSlot`, or of `cond` when given (e.g. a hero
   * card previewed at an empty slot). One entry per required type, in inf/arc/cav order,
   * counting the units of that type in the hero's whole ring (Warden's radius 2 too),
   * exactly as the evaluator does. -> {need:[{type, have, need, met}], met, ring:[slot]},
   * or null when there is no hero there and no cond.
   */
  function formationStatus(st, heroSlot, cond) {
    const p = st.pieces[heroSlot];
    const c = cond || (p && p.kind === 'hero' ? p.cond : null);
    if (!c) return null;
    const ring = heroArea(st, heroSlot), cnt = { inf: 0, arc: 0, cav: 0 };
    for (const j of ring) { const q = st.pieces[j]; if (q && q.kind === 'unit') cnt[q.type]++; }
    const need = TYPES.filter((t) => (c[t] || 0) > 0).map((t) => ({ type: t, have: cnt[t], need: c[t], met: cnt[t] >= c[t] }));
    return { need, met: need.every((n) => n.met), ring };
  }

  function predict(st, oi, slot) {
    const card = st.offer[oi];
    if (!card || legalSlots(st, card).indexOf(slot) < 0) return null;
    const before = evalState(st, true);
    const after = evaluate(st.board, toArr(putPiece(st.pieces, card, slot)), st.general, tunOf(st), true);
    const deltas = {};
    for (let i = 0; i < S; i++) {
      if (i === slot || after.values[i] === null) continue;
      const d = after.values[i] - (before.values[i] || 0);
      if (d !== 0) deltas[i] = d;
    }
    const ownValue = after.values[slot] || 0; // an officer on an empty slot stands on a post worth 0
    const own = card.kind === 'officer' ? ownValue - (before.values[slot] || 0) : ownValue;
    const had = {};
    for (const c of before.combos) had[comboKey(c)] = 1;
    return {
      slot, card, deltas, own, ownValue,
      totalBefore: before.total, totalAfter: after.total,
      newCombos: after.combos.filter((c) => !had[comboKey(c)]),
      area: card.kind === 'hero' ? heroArea(st, slot) : card.kind === 'officer' ? officerArea(st, slot, card) : []
    };
  }

  const target = (st) => tunOf(st).target[st.tier];
  /**
   * §7.7: the star ratios (x target) for the battle's tier. `tun.stars` is either one
   * array shared by every tier (the legacy form) or {easy:[...], normal:[...], hard:[...]};
   * a tier missing from the object falls back to normal's array, then [1].
   */
  function starRatios(st) {
    const s = tunOf(st).stars;
    if (Array.isArray(s)) return s.slice();
    const arr = s && (s[st.tier] || s.normal);
    return Array.isArray(arr) ? arr.slice() : [1];
  }
  /** The totals each star needs, rounded up (totals are whole numbers). */
  const starThresholds = (st) => starRatios(st).map((m) => Math.ceil(target(st) * m - 1e-9));
  function stars(st) {
    const t = total(st), tg = target(st);
    return starRatios(st).filter((m) => t >= tg * m - 1e-9).length;
  }
  const undo = (st) => (st && st.prev) || st;

  /**
   * Terrain modifiers a unit of `type` would get (§7.9, the unit card's terrain row):
   * {terrain: n} for every terrain where the terrain part plus the general's flat
   * terrain bonus is not 0. Read off evaluate() for a lone unit, so it can never
   * disagree with the score.
   */
  function terrainMods(st, type) {
    const T = tunOf(st), out = {};
    for (const terr of Object.keys(T.terrain.table)) {
      const P = new Array(S).fill(null);
      P[0] = { kind: 'unit', type };
      const ev = evaluate(new Array(S).fill({ terrain: terr }), P, st && st.general, T, false);
      const n = ev.pt[PARTS.indexOf('terrain') * S] + ev.pt[PARTS.indexOf('general') * S];
      if (n) out[terr] = n;
    }
    return out;
  }

  Object.assign(C, {
    PARTS, SHAPE_IDS, createBattle, chooseSetup, legalSlots, canPick, place, valueMap, total, combosOf,
    partialCombos, predict, heroArea, officerArea, formationStatus, shapeCells, officerOf, stars, starRatios, starThresholds, target, undo,
    totalAfter, redeal, cardsFor, terrainMods, orthOf: (i) => ORTH[i].slice(), diagOf: (i) => DIAG[i].slice()
  });
  if (typeof module !== 'undefined') module.exports = C;
})();
</script>

/*

 *
 * Reuses two old-game data files when they are loaded before this one (both
 * load standalone, no registry needed): js/data/art-tiles.js (TTF.ArtTiles, the
 * painted ground) and js/data/art-units.js (TTF.ArtSymbolSets 'units', the
 * troop silhouettes). Without them it falls back to its own flat ground and
 * simple silhouettes, so core/ still runs alone.
 *
 * Exposes globalThis.TTFArt: sheet() (inject once), icon(), hero(), officer(),
 * tileBg(terrain, variant), emblem(generalId), glyph(generalId), star() and
 * small UI icons. Pure string output except sheet().
 */
(function () {
  const A = globalThis.TTFArt = {};
  const TTF = globalThis.TTF || {};

  // ---- palette -------------------------------------------------------------
  // The ground palette for the reused tiles: four clearly different grounds.
  const PAL = {
    t_plains: '#b7c879', t_road: '#b89a68', t_forest: '#5b8a4e', t_hills: '#b49a68',
    t_water: '#82b0d6', t_bridge: '#b89b74', t_marsh: '#9fae82', t_bank: '#9a9560',
    t_fields: '#dfbb4c', t_stones: '#8c957f', ink: '#3a2f21', ink_invert: '#f4ecd8',

  };
  A.PAL = PAL;
  A.TYPE_COL = { inf: '#2f4d73', arc: '#2e5c3d', cav: '#7a3420' };
  A.TYPE_LIT = { inf: '#5b82b5', arc: '#4f8c5f', cav: '#b25a38' };

  // ---- the symbol sheet ----------------------------------------------------
  const UNIT_SYM = { inf: 'troop_spearmen', arc: 'troop_longbows', cav: 'troop_knights' };
  const FALLBACK = {
    inf: '<circle cx="25" cy="14" r="5.5" fill="currentColor"/><path fill="currentColor" d="M18,20 H32 L34,41 H29 V56 H24 V45 H23 V56 H18 L16,41 Z"/><rect x="39" y="4" width="2.6" height="50" fill="currentColor"/><circle cx="16" cy="36" r="8.5" fill="currentColor"/>',
    arc: '<circle cx="28" cy="14" r="5.5" fill="currentColor"/><path fill="currentColor" d="M21,20 H35 L37,41 H32 V56 H27 V45 H26 V56 H21 L19,41 Z"/><path fill="none" stroke="currentColor" stroke-width="3" d="M16,7 C6,23 6,39 16,54"/>',
    cav: '<path fill="currentColor" d="M9,13 C6,14 5,19 7,22 L11,23 C12,27 14,29 18,30 C16,33 16,37 18,40 L44,40 C48,38 50,34 49,29 C46,26 40,25 30,25 C26,25 24,22 22,20 C21,17 15,13 9,13 Z M18,39 h4 v17 h-4 Z M40,39 h4 v17 h-4 Z"/><circle cx="30" cy="12" r="4.6" fill="currentColor"/><path fill="currentColor" d="M26,27 H34 L33,16 H27 Z"/>'
  };

  function unitSymbols() {

      const id = 'art-card-' + UNIT_SYM[t];

      return sym ? sym.replace('id="' + id + '"', 'id="u-' + t + '"')
        : '<symbol id="u-' + t + '" viewBox="0 0 64 64">' + FALLBACK[t] + '</symbol>';
    }).join('');
  }

  const OWN = {
    // Hero: a crowned bust with a cloak.
    'u-hero': '<path fill="currentColor" d="M12,58 C12,42 20,34 32,34 C44,34 52,42 52,58 Z"/>' +
      '<path fill="var(--hero-cloak,#7a2a1f)" d="M18,58 C19,46 24,40 32,40 C40,40 45,46 46,58 Z" opacity=".55"/>' +
      '<circle cx="32" cy="24" r="9" fill="currentColor"/>' +
      '<path fill="var(--hero-crown,#fff1b8)" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" d="M22,16 L23.5,5 L28,11 L32,3 L36,11 L40.5,5 L42,16 Z"/>',
    // Officer: a swallow-tailed standard on a pole.
    'u-officer': '<rect x="17" y="6" width="3.6" height="54" rx="1.2" fill="#4a2e16"/>' +
      '<path fill="currentColor" stroke="#2a1a06" stroke-width="1.6" stroke-linejoin="round" d="M20.6,8 H54 L45,19 L54,30 H20.6 Z"/>' +
      '<path fill="#e7bf5c" d="M26,14 h14 v3 h-14 Z M26,21 h10 v3 h-10 Z" opacity=".85"/>' +
      '<circle cx="18.8" cy="6" r="4.4" fill="#e7bf5c" stroke="#5e3f0b" stroke-width="1.2"/>',
    'u-star': '<path d="M12,1.6 L15.1,8.4 L22.5,9.1 L16.9,14 L18.6,21.3 L12,17.4 L5.4,21.3 L7.1,14 L1.5,9.1 L8.9,8.4 Z"/>',
    'u-restart': '<path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" d="M27,9 A12,12 0 1 1 9.6,11"/><path fill="currentColor" d="M3,7 L14,4 L12,15 Z"/>',
    'u-undo': '<path fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M9,13 H22 A7.5,7.5 0 0 1 22,28 H13"/><path fill="currentColor" d="M3,13 L11,6 V20 Z"/>',
    'u-swords': '<g stroke-linecap="round"><path stroke="#e9e2cf" stroke-width="4" d="M15,49 L47,13 M49,49 L17,13"/>' +
      '<path stroke="#5e3f0b" stroke-width="3" d="M12,44 L20,52 M52,44 L44,52"/><path stroke="#e7bf5c" stroke-width="5" d="M11,53 L14,50 M53,53 L50,50"/></g>'
  };
  // Generals: emblems engraved on a brass coin (currentColor = the engraving).
  const EMB = {
    horse_lord: '<path fill="currentColor" d="M20,56 H45 L43,46 C49,41 51,31 47,22 L51,12 L42,15 C36,9 25,11 21,19 L12,30 C11,33 13,36 16,36 L25,33 C27,40 22,47 20,56 Z"/><circle cx="36" cy="22" r="2.4" fill="var(--coin,#d8b048)"/>',
    iron_marshal: '<path fill="currentColor" d="M17,24 C17,11 47,11 47,24 V47 C47,53 17,53 17,47 Z"/><rect x="21" y="27" width="22" height="4" rx="1.5" fill="var(--coin,#d8b048)"/><rect x="30.5" y="31" width="3" height="16" fill="var(--coin,#d8b048)"/><path fill="currentColor" d="M29,11 L32,3 L35,11 Z"/>',
    ranger: '<path fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" d="M20,8 C38,18 38,46 20,56"/><path stroke="currentColor" stroke-width="2" d="M20,8 V56"/><path stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M14,32 H50"/><path fill="currentColor" d="M56,32 L47,26 V38 Z"/><path fill="currentColor" d="M12,27 L17,32 L12,37 L9,37 L13,32 L9,27 Z"/>',
    tactician: '<circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="3"/><path fill="currentColor" d="M32,6 L36.5,27.5 L58,32 L36.5,36.5 L32,58 L27.5,36.5 L6,32 L27.5,27.5 Z"/><circle cx="32" cy="32" r="3.2" fill="var(--coin,#d8b048)"/>',
    captain: '<path fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" d="M14,24 L32,12 L50,24 M14,38 L32,26 L50,38 M14,52 L32,40 L50,52"/>',
    warden: '<path fill="currentColor" d="M16,58 V24 H21 V15 H27 V22 H30 V15 H34 V22 H37 V15 H43 V24 H48 V58 Z"/><path fill="var(--coin,#d8b048)" d="M27,58 V47 A5,5 0 0 1 37,47 V58 Z"/><rect x="29.5" y="31" width="5" height="7" rx="2" fill="var(--coin,#d8b048)"/>'
  };

  let sheetDone = false;
  A.sheet = function sheet() {
    if (sheetDone || typeof document === 'undefined') return;
    sheetDone = true;
    let s = unitSymbols();
    for (const k in OWN) s += '<symbol id="' + k + '" viewBox="0 0 ' + (k === 'u-star' ? 24 : k === 'u-restart' || k === 'u-undo' ? 32 : 64) + ' ' + (k === 'u-star' ? 24 : k === 'u-restart' || k === 'u-undo' ? 32 : 64) + '">' + OWN[k] + '</symbol>';
    for (const k in EMB) s += '<symbol id="g-' + k + '" viewBox="0 0 64 64">' + EMB[k] + '</symbol>';
    const div = document.createElement('div');
    div.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">' + s + '</svg>';
    document.body.insertBefore(div.firstChild, document.body.firstChild);
  };

  const use = (id, cls, vb) => '<svg class="' + (cls || 'ico') + '" viewBox="' + (vb || '0 0 64 64') + '" aria-hidden="true"><use href="#' + id + '"/></svg>';
  A.icon = (type, cls) => use('u-' + type, 'ico ico-' + type + (cls ? ' ' + cls : ''));
  A.heroIcon = (cls) => use('u-hero', 'ico ico-hero' + (cls ? ' ' + cls : ''));
  A.officerIcon = (cls) => use('u-officer', 'ico ico-officer' + (cls ? ' ' + cls : ''));
  A.star = (cls) => use('u-star', 'star' + (cls ? ' ' + cls : ''), '0 0 24 24');
  A.ui = (name) => use('u-' + name, 'uico', '0 0 32 32');
  A.emblem = (id) => use('g-' + id, 'emblem');

  // ---- officer shapes (docs/P44-CORE.md §7.2) --------------------------------
  // A small stroke glyph per shape (viewBox 24, currentColor): plus, x with corner
  // dots, bars with end ticks, arrows that start at a bar (the officer's side).
  const ARROW = 'M19,5 V19 M18,12 H5.5 M10.5,6.5 L4.5,12 L10.5,17.5';
  const SHAPE_GLYPH = {
    cross: '<path d="M12,3 V21 M3,12 H21"/>',
    corners: '<path d="M6,6 L18,18 M18,6 L6,18" stroke-width="1.6"/><g stroke="none" fill="currentColor"><circle cx="5" cy="5" r="3.2"/><circle cx="19" cy="5" r="3.2"/><circle cx="5" cy="19" r="3.2"/><circle cx="19" cy="19" r="3.2"/></g>',
    row: '<path d="M3,12 H21 M3,7 V17 M21,7 V17"/>',
    column: '<path d="M12,3 V21 M7,3 H17 M7,21 H17"/>',
    left: '<path d="' + ARROW + '"/>',
    right: '<path d="' + ARROW + '" transform="rotate(180 12 12)"/>',
    above: '<path d="' + ARROW + '" transform="rotate(90 12 12)"/>',
    below: '<path d="' + ARROW + '" transform="rotate(-90 12 12)"/>'
  };
  A.SHAPE_IDS = Object.keys(SHAPE_GLYPH);
  /** shapeGlyph(shape, cls) - the stroke glyph of an officer shape (currentColor). */
  A.shapeGlyph = (shape, cls) => '<svg class="shg' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    (SHAPE_GLYPH[shape] || SHAPE_GLYPH.cross) + '</svg>';
  /** Where the officer stands in the 4x4 card diagram so the shape reads at full reach. */
  A.SHAPE_HOME = { cross: 5, corners: 5, row: 5, column: 5, left: 7, right: 4, above: 13, below: 1 };

  // ---- general rule glyphs -------------------------------------------------
  const G = '#3f7a2e', INK = '#2a1a06';
  const txt = (x, y, s, col, size) => '<text x="' + x + '" y="' + y + '" fill="' + col + '" font-size="' + (size || 17) + '" font-weight="800" font-family="Segoe UI,system-ui,sans-serif" text-anchor="middle">' + s + '</text>';
  const uicon = (t, x, y, s, col) => '<svg x="' + x + '" y="' + y + '" width="' + s + '" height="' + s + '" viewBox="0 0 64 64" style="color:' + (col || INK) + '"><use href="#u-' + t + '"/></svg>';
  function grid(n, cell, x0, y0, fillFn) {
    let o = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      o += '<rect x="' + (x0 + x * cell + 0.6) + '" y="' + (y0 + y * cell + 0.6) + '" width="' + (cell - 1.2) + '" height="' + (cell - 1.2) + '" rx="1.6" fill="' + fillFn(x, y) + '"/>';
    }
    return o;
  }
  // Each glyph takes the general rule numbers (tun.general) so it shows the live value.
  const GLYPH = {
    horse_lord: (n) => '<rect x="3" y="4" width="34" height="32" rx="6" fill="' + PAL.t_plains + '" stroke="#6f7a3c" stroke-width="1.5"/>' + uicon('cav', 5, 4, 30) + txt(56, 27, '+' + n.horse_lord, G, 19),
    iron_marshal: (n) => '<rect x="4" y="17.5" width="34" height="6" rx="3" fill="' + A.TYPE_LIT.inf + '"/>' +
      [2, 15, 28].map((x) => '<rect x="' + x + '" y="14" width="12" height="13" rx="2.5" fill="#f0e2bd" stroke="' + INK + '" stroke-width="1.4"/>').join('') + txt(56, 27, '+' + n.iron_marshal, G, 19),
    ranger: (n) => '<rect x="3" y="4" width="34" height="32" rx="6" fill="' + PAL.t_hills + '" stroke="#6e5a34" stroke-width="1.5"/>' + uicon('arc', 5, 4, 30) + txt(56, 27, '+' + n.ranger, G, 19),
    tactician: (n) => '<path d="M22,6 L39,34 L5,34 Z" fill="#e7bf5c" fill-opacity=".25" stroke="#9b7020" stroke-width="2.4" stroke-linejoin="round"/>' +
      '<circle cx="22" cy="7" r="5.5" fill="' + A.TYPE_LIT.inf + '"/><circle cx="6" cy="33" r="5.5" fill="' + A.TYPE_LIT.arc + '"/><circle cx="38" cy="33" r="5.5" fill="' + A.TYPE_LIT.cav + '"/>' + txt(57, 27, '+' + n.tactician, G, 19),
    captain: (n) => '<rect x="3" y="4" width="34" height="32" rx="6" fill="#f0e2bd" stroke="#9b7020" stroke-width="1.5"/>' + uicon('officer', 6, 5, 30, A.TYPE_LIT.inf) + txt(57, 27, '+' + n.captain, G, 19),
    warden: (n) => grid(5, 7.4, 3, 1.5, (x, y) => (x === 2 && y === 2 ? '#c9a13a' : '#f3dd96')) +
      '<rect x="3" y="1.5" width="37" height="37" rx="3" fill="none" stroke="#c9a13a" stroke-width="2"/>' + txt(58, 27, String(n.warden), '#8a5f14', 19)
  };
  /** glyph(generalId, tun?) - tun defaults to TTFCore.TUN_DEFAULT. */
  A.glyph = (id, tun) => {
    const T = tun || (globalThis.TTFCore || {}).TUN_DEFAULT || {};
    return '<svg class="glyph" viewBox="0 0 72 40" aria-hidden="true">' + (GLYPH[id] ? GLYPH[id](T.general || {}) : '') + '</svg>';
  };

  // ---- terrain tiles ---------------------------------------------------------
  function rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const f1 = (n) => Math.round(n * 10) / 10;

  function tree(x, y, s, g) {
    const pine = g() < 0.3;
    let o = '<ellipse cx="' + f1(x + 4 * s) + '" cy="' + f1(y + 1) + '" rx="' + f1(15 * s) + '" ry="' + f1(4 * s) + '" fill="#000" opacity=".28"/>';
    o += '<rect x="' + f1(x - 2.2 * s) + '" y="' + f1(y - 12 * s) + '" width="' + f1(4.4 * s) + '" height="' + f1(12 * s) + '" fill="#4b3320"/>';
    if (pine) {
      [[0, '#2c4a2a'], [9, '#355a31'], [17, '#3f6a39']].forEach((l, k) => {
        const w = (15 - k * 3.4) * s, yb = y - (8 + l[0]) * s, yt = yb - 17 * s;
        o += '<path d="M' + f1(x - w) + ',' + f1(yb) + ' L' + f1(x) + ',' + f1(yt) + ' L' + f1(x + w) + ',' + f1(yb) + ' Z" fill="' + l[1] + '" stroke="#1d3319" stroke-width="1.2" stroke-linejoin="round"/>';
      });
    } else {
      const c = [[-8, -20, 10], [8, -21, 10], [0, -30, 11], [0, -18, 11]];
      o += '<g stroke="#1d3319" stroke-width="1.3">' + c.map((q) => '<circle cx="' + f1(x + q[0] * s) + '" cy="' + f1(y + q[1] * s) + '" r="' + f1(q[2] * s) + '" fill="#355f31"/>').join('') + '</g>';
      o += c.map((q) => '<circle cx="' + f1(x + q[0] * s) + '" cy="' + f1(y + q[1] * s) + '" r="' + f1(q[2] * s - 1) + '" fill="#3f6e38"/>').join('');
      o += '<circle cx="' + f1(x - 4 * s) + '" cy="' + f1(y - 31 * s) + '" r="' + f1(5.5 * s) + '" fill="#6a9a52" opacity=".8"/>';
      o += '<circle cx="' + f1(x - 11 * s) + '" cy="' + f1(y - 22 * s) + '" r="' + f1(4 * s) + '" fill="#5d8d4a" opacity=".8"/>';
    }
    return o;
  }
  function mound(id, cx, cy, rx, ry) {
    return '<defs><radialGradient id="' + id + '" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#e6cf95"/><stop offset=".55" stop-color="#b9965a"/><stop offset="1" stop-color="#7f6234"/></radialGradient></defs>' +
      '<ellipse cx="' + (cx + 6) + '" cy="' + (cy + 2) + '" rx="' + rx + '" ry="' + (ry * 0.22) + '" fill="#000" opacity=".22"/>' +
      '<path d="M' + (cx - rx) + ',' + cy + ' C' + (cx - rx * 0.7) + ',' + (cy - ry * 1.25) + ' ' + (cx + rx * 0.7) + ',' + (cy - ry * 1.25) + ' ' + (cx + rx) + ',' + cy + ' Z" fill="url(#' + id + ')" stroke="#6b4f26" stroke-width="1.4"/>' +
      '<path d="M' + (cx - rx * 0.55) + ',' + (cy - ry * 0.55) + ' Q' + cx + ',' + (cy - ry * 0.95) + ' ' + (cx + rx * 0.35) + ',' + (cy - ry * 0.8) + '" fill="none" stroke="#fff3cf" stroke-width="2" opacity=".45" stroke-linecap="round"/>' +
      '<path d="M' + (cx - rx * 0.3) + ',' + (cy - 3) + ' l3,-5 l3,5 M' + (cx + rx * 0.25) + ',' + (cy - 4) + ' l2,-4 l2,4" fill="none" stroke="#5f6e30" stroke-width="1.6" stroke-linecap="round"/>';
  }
  function rock(x, y, s) {
    return '<path d="M' + f1(x - 7 * s) + ',' + f1(y) + ' L' + f1(x - 5 * s) + ',' + f1(y - 6 * s) + ' L' + f1(x + 1 * s) + ',' + f1(y - 8 * s) + ' L' + f1(x + 7 * s) + ',' + f1(y - 3 * s) + ' L' + f1(x + 7 * s) + ',' + f1(y) + ' Z" fill="#9a9584" stroke="#4d4a40" stroke-width="1.1"/>' +
      '<path d="M' + f1(x - 5 * s) + ',' + f1(y - 6 * s) + ' L' + f1(x + 1 * s) + ',' + f1(y - 8 * s) + ' L' + f1(x) + ',' + f1(y - 3 * s) + ' Z" fill="#cfc9b4" opacity=".7"/>';
  }
  function tuft(x, y, s, col) {
    return '<path d="M' + f1(x - 4 * s) + ',' + f1(y) + ' Q' + f1(x - 4 * s) + ',' + f1(y - 6 * s) + ' ' + f1(x - 6 * s) + ',' + f1(y - 9 * s) +
      ' M' + f1(x) + ',' + f1(y) + ' Q' + f1(x) + ',' + f1(y - 8 * s) + ' ' + f1(x + 1 * s) + ',' + f1(y - 12 * s) +
      ' M' + f1(x + 4 * s) + ',' + f1(y) + ' Q' + f1(x + 4 * s) + ',' + f1(y - 6 * s) + ' ' + f1(x + 7 * s) + ',' + f1(y - 9 * s) + '" fill="none" stroke="' + col + '" stroke-width="1.8" stroke-linecap="round"/>';
  }
  function flower(x, y, col) {
    return '<g fill="' + col + '"><circle cx="' + x + '" cy="' + (y - 2) + '" r="1.8"/><circle cx="' + (x + 2) + '" cy="' + y + '" r="1.8"/><circle cx="' + x + '" cy="' + (y + 2) + '" r="1.8"/><circle cx="' + (x - 2) + '" cy="' + y + '" r="1.8"/></g><circle cx="' + x + '" cy="' + y + '" r="1.2" fill="#e7bf5c"/>';
  }
  function stook(x, y, s) {
    let o = '<ellipse cx="' + f1(x + 3 * s) + '" cy="' + f1(y + 1) + '" rx="' + f1(11 * s) + '" ry="' + f1(3 * s) + '" fill="#000" opacity=".22"/>';
    o += '<path d="M' + f1(x - 9 * s) + ',' + f1(y) + ' L' + f1(x) + ',' + f1(y - 24 * s) + ' L' + f1(x + 9 * s) + ',' + f1(y) + ' Z" fill="#e4c46a" stroke="#8a6a24" stroke-width="1.2" stroke-linejoin="round"/>';
    o += '<path d="M' + f1(x - 4 * s) + ',' + f1(y - 2) + ' L' + f1(x) + ',' + f1(y - 21 * s) + ' M' + f1(x + 4 * s) + ',' + f1(y - 2) + ' L' + f1(x) + ',' + f1(y - 21 * s) + '" stroke="#a7822e" stroke-width="1.1"/>';
    o += '<rect x="' + f1(x - 6 * s) + '" y="' + f1(y - 11 * s) + '" width="' + f1(12 * s) + '" height="' + f1(2.6 * s) + '" fill="#8a6a24"/>';
    return o;
  }

  // Props keep to the rim: the middle is where a token stands.
  function props(terrain, v) {
    const g = rng(1000 + v * 97 + terrain.length * 13);
    const flip = v % 2 === 1;
    const X = (x) => (flip ? 160 - x : x);
    let o = '';
    if (terrain === 'forest') {
      const spots = [[20, 156, 0.95], [142, 154, 1], [12, 104, 0.7], [150, 100, 0.66], [80, 160, 0.62], [52, 44, 0.5], [108, 44, 0.5]];
      spots.sort((a, b) => a[1] - b[1]).forEach((t) => { o += tree(X(t[0]), t[1], t[2], g); });
    } else if (terrain === 'hills') {
      o += mound('m3', X(148), 104, 22, 20) + mound('m4', X(14), 100, 18, 16) + mound('m1', X(38), 160, 48, 44) + mound('m2', X(128), 160, 40, 34);
      o += rock(X(84), 156, 0.9) + rock(X(14), 92, 0.7);
    } else if (terrain === 'plains') {
      for (let k = 0; k < 9; k++) {
        const ang = g() * Math.PI * 2, rr = 58 + g() * 18;
        const x = 80 + Math.cos(ang) * rr, y = 92 + Math.sin(ang) * rr * 0.8;
        if (y < 40 || y > 156 || x < 6 || x > 154) continue;
        o += tuft(f1(x), f1(y), 0.9 + g() * 0.4, k % 2 ? '#6f8e3f' : '#869f4c');
      }
      [[22, 140, '#fbf2d8'], [136, 132, '#f2c94c'], [30, 76, '#fbf2d8'], [146, 66, '#e9a3a3'], [96, 152, '#fbf2d8']].forEach((f) => { o += flower(X(f[0]), f[1], f[2]); });
    } else if (terrain === 'fields') {
      o += stook(X(24), 154, 1) + stook(X(140), 152, 0.9) + stook(X(150), 98, 0.6);
      for (let k = 0; k < 10; k++) o += tuft(f1(X(8 + g() * 144)), f1(40 + g() * 116), 0.7, '#a7822e');
    }
    return o;
  }

  // A tiny tile swatch for the unit cards' terrain row (§7.9): the tile's ground
  // colour and its motif (tree / mound / grass tuft / stook), readable at ~18px.
  const TMOTIF = {
    forest: '<path d="M12,3.5 L18,13 H15 L19,18.5 H5 L9,13 H6 Z" fill="#2c5a2a" stroke="#183a17" stroke-width="1" stroke-linejoin="round"/><rect x="10.8" y="18.5" width="2.4" height="3" fill="#5c3a20"/>',
    hills: '<path d="M1.5,21 Q8,6 14.5,21 Z" fill="#9a7c4a" stroke="#6e5530" stroke-width="1"/><path d="M10,21 Q16.5,10 23,21 Z" fill="#c4a874" stroke="#6e5530" stroke-width="1"/><path d="M6,12 Q8,9.5 10,12" stroke="#fff3cf" stroke-width="1.2" fill="none" opacity=".7"/>',
    plains: '<path d="M6,20 Q6,13 3.5,9 M10,20 Q10,11 11.5,5.5 M14,20 Q14,13 17,9.5 M18.5,20 Q19,15 21,12.5" stroke="#4f6e2a" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="7" cy="8" r="1.6" fill="#fbf2d8"/>',
    fields: '<path d="M5,21 L12,4.5 L19,21 Z" fill="#e4c46a" stroke="#8a6a24" stroke-width="1.2" stroke-linejoin="round"/><rect x="7.6" y="12.5" width="8.8" height="2" fill="#8a6a24"/><path d="M9.5,20 L12,6 M14.5,20 L12,6" stroke="#a7822e" stroke-width="1"/>'
  };
  A.terrainIcon = (terrain, cls) => '<svg class="tico t-' + terrain + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-label="' + terrain + '" role="img">' +
    '<rect x=".75" y=".75" width="22.5" height="22.5" rx="4.5" fill="' + (PAL['t_' + terrain] || '#888') + '" stroke="#3a2f21" stroke-width="1.5"/>' + (TMOTIF[terrain] || '') + '</svg>';

  const TILE_CACHE = {};
  /** CSS url() for a painted terrain tile (two prop variants per terrain). */
  A.tileBg = function tileBg(terrain, variant) {
    const key = terrain + (variant % 2);
    if (TILE_CACHE[key]) return TILE_CACHE[key];
    const T = TTF.ArtTiles && TTF.ArtTiles.tiles;
    let ground = T && T[terrain] ? T[terrain].replace(/\{\{(\w+)\}\}/g, (m, k) => PAL[k] || '#888')
      : '<rect width="160" height="160" fill="' + PAL['t_' + terrain] + '"/>';
    if (terrain === 'forest') ground += '<rect width="160" height="160" fill="#1d3319" opacity=".12"/>';
    if (terrain === 'hills') ground += '<ellipse cx="80" cy="70" rx="70" ry="50" fill="#fff3cf" opacity=".08"/>';
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" preserveAspectRatio="none">' + ground + props(terrain, variant % 2) + '</svg>';
    return (TILE_CACHE[key] = 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")');
  };
})();
</script>
<script>
/*
 * core/js/board.js - the 4x4 board: painted tiles (terrain art only), unit
 * tokens with live value medallions, the combo overlay (bands, triad
 * triangles, in-progress ghosts), hero rings at rest and the drop preview
 * (docs/P44-CORE.md §3), plus officer posts, at-rest officer areas, hero
 * formation badges and the hover / long-press area focus (§7). Reads state
 * only through TTFCore.
 *
 * globalThis.TTFBoard = { mount(el), render(state, opts), preview(pred, after?), clear(),
 *                         focus(slot|null), hasArea(slot), setPicking(slots|null),

(function () {

  let el = null, tilesEl, areasEl, unitsEl, combosEl, fxEl, tileEls = [], cellEls = [];
  let boardKey = null, lastVals = {}, lastCombos = {}, lastPieces = {};
  let previewOn = false, curState = null, focusSlot = null, focusG = null;

  const cx = (i) => (i % N) * U + U / 2, cy = (i) => ((i / N) | 0) * U + U / 2;

  B.mount = function mount(root) {

    tileEls = []; cellEls = [];
    for (let i = 0; i < S; i++) {

  };

  // ---- tiles ---------------------------------------------------------------
  function paintTiles(st) {

  // ---- pieces ----------------------------------------------------------------

    const t0 = performance.now(), dur = 380;

  function pipHTML(o, cls, bare) {

  }
  // §7.3: the formation badge - one icon per required unit, lit while the ring holds it.
  function badgeHTML(fs, st, cls) {
    let h = '';
    fs.need.forEach((n) => { for (let k = 0; k < n.need; k++) h += '<i class="fu ' + n.type + (k < n.have ? ' on' : '') + '">' + Art.icon(n.type) + '</i>'; });
    return '<div class="fbadge' + (fs.met ? ' met' : '') + (cls ? ' ' + cls : '') + '">' + h + '<b>+' + tunOf(st).hero.ringMet + '</b></div>';
  }

  /** opts: {fresh: slot just placed (pop), anim: bool (count-up and bumps)} */
  B.render = function render(st, opts) {
    const o = opts || {};

    const key = st.seed + '|' + st.board.map((b) => b.terrain[0]).join('') + '|' + st.general;
    if (key !== boardKey) { paintTiles(st); boardKey = key; lastVals = {}; lastCombos = {}; lastPieces = {}; }
    const vm = st.phase === 'setup' ? {} : C.valueMap(st);
    for (let i = 0; i < S; i++) {
      const p = st.pieces[i], cell = cellEls[i];
      tileEls[i].classList.toggle('occ', !!p && p.kind !== 'post');
      tileEls[i].classList.toggle('haspost', !!p && p.kind === 'post');
      if (!p) { cell.innerHTML = ''; continue; }
      const wasHere = lastPieces[i] && lastPieces[i].uid === p.uid;
      const pop = o.fresh === i && !wasHere, pipPop = o.fresh === i && wasHere;
      // a lone post adds 0 and has no medallion
      if (p.kind === 'post') { cell.innerHTML = postHTML(C.officerOf(p.officer), pop ? 'pop' : ''); continue; }

      let html = '';
      if (p.kind === 'hero') {
        html += '<div class="tok hero' + (pop ? ' pop' : '') + '">' + Art.heroIcon() + '</div>';
        html += badgeHTML(C.formationStatus(st, i), st);
      } else html += '<div class="tok ' + p.type + (pop ? ' pop' : '') + '">' + Art.icon(p.type) + '</div>';
      if (p.officer) html += pipHTML(C.officerOf(p.officer), pipPop ? 'pop' : '');
      const prev = lastVals[i];
      const bump = o.anim && prev !== undefined && prev !== v;
      html += '<div class="med ' + medClass(v) + (bump ? ' bump' : '') + '">' + (bump ? prev : v) + '</div>';

  function triadEmblem(c) {

    const mx = (Math.min.apply(null, xs) + Math.max.apply(null, xs) + 1) / 2 * U, my = (Math.min.apply(null, ys) + Math.max.apply(null, ys) + 1) / 2 * U;
    const g = el$('g', {}, 'temb'), r = 13, pt = (k) => [mx + r * Math.cos(-Math.PI / 2 + k * 2 * Math.PI / 3), my + 2 + r * Math.sin(-Math.PI / 2 + k * 2 * Math.PI / 3)];
    const P = [pt(0), pt(1), pt(2)];

      g.appendChild(el$('line', Object.assign({ 'stroke-width': 24, stroke: LIT[c.type] }, L), 'band'));
      g.appendChild(el$('line', Object.assign({ 'stroke-width': 5 }, L), 'band-h'));

  function drawCombos(st, anim) {

    cs.sort((a, b) => (a.kind === 'line' ? 0 : 1) - (b.kind === 'line' ? 0 : 1)).forEach((c) => {
      const k = comboKey(c); now[k] = 1;

  function drawPartials(st) {
    const by = {};
    if (st.phase === 'draft') for (const p of C.partialCombos(st)) { (by[p.slot] = by[p.slot] || {})[p.type] = 1; }
    for (let i = 0; i < S; i++) {
      const pg = tileEls[i].querySelector('.pg');
      if (!pg) continue;
      const ts = by[i] ? ['inf', 'arc', 'cav'].filter((t) => by[i][t]) : [];

      pg.innerHTML = ts.map((t) => '<i class="' + t + '">' + Art.icon(t) + '</i>').join('');

  }

  // ---- areas at rest -----------------------------------------------------------
  function areaRect(slots, inset) {
    const xs = slots.map((s) => s % N), ys = slots.map((s) => (s / N) | 0);

  }
  // §7.4: every placed officer's area at rest as ONE faint outline per connected run of
  // cells (a strip for lines, single cells for cross / corners) in its type colour,
  // nested by type (inf outermost) so overlapping areas stay apart. The strong
  // per-tile highlight is the hover / long-press focus.
  function runs(area) {
    const left = area.slice(), out = [];

      runs(C.officerArea(st, i)).forEach((r) => {
        const R = Object.assign({ rx: 14 }, areaRect(r, inset));
        areasEl.appendChild(el$('rect', R, 'ao-o'));
        areasEl.appendChild(el$('rect', R, 'ao ' + o.type));
      });
    }
  }

  // Hero rings at rest: the ring's bounding square, solid when the formation holds.
  let restG = null;
  function drawRest(st) {
    if (!restG) restG = el$('g', {});
    restG.innerHTML = '';
    for (let i = 0; i < S; i++) {
      const p = st.pieces[i];
      if (!p || p.kind !== 'hero') continue;
      const fs = C.formationStatus(st, i), R = Object.assign({ rx: 14 }, areaRect(fs.ring.concat([i]), 5));
      restG.appendChild(el$('rect', R, 'ring-o'));
      restG.appendChild(el$('rect', R, 'ring' + (fs.met ? ' met' : '')));
      cellEls[i].querySelector('.tok.hero').classList.toggle('met', fs.met);
    }
    const seenSq = {};
    triads.forEach((c) => { const e = triadEmblem(c), k = e.firstChild.getAttribute('points'); if (!seenSq[k]) { seenSq[k] = 1; restG.appendChild(e); } });

    if (!p) return null;
    if (p.kind === 'hero') return { hero: true, area: C.heroArea(st, i) };
    if (p.officer) return { officer: C.officerOf(p.officer), area: C.officerArea(st, i) };
    return null;
  }

  B.hasArea = (slot) => slot !== null && slot !== undefined && !!focusInfo(curState, slot);
  B.focus = function focus(slot) {
    const s = slot === undefined ? null : slot;

  };
  function drawFocus() {

    const f = !previewOn && focusSlot !== null ? focusInfo(curState, focusSlot) : null;
    el.classList.toggle('focusing', !!f);
    tileEls.forEach((t, i) => t.classList.toggle('inarea', !!f && (i === focusSlot || f.area.indexOf(i) >= 0)));
    if (!f) return;
    focusG = el$('g', {}, 'focus');
    if (f.officer) {
      f.area.forEach((i) => focusG.appendChild(el$('rect', Object.assign({ rx: 12 }, areaRect([i], 7)), 'area ' + f.officer.type)));

    }

  }

  // ---- preview ---------------------------------------------------------------
  B.clear = function clear() {
    previewOn = false;
    fxEl.innerHTML = '';
    focusG = null;
    if (restG) fxEl.appendChild(restG);

    unitsEl.querySelectorAll('.pv').forEach((n) => n.remove());
    cellEls.forEach((c) => c.classList.remove('pvjoin'));

  };

  /** Show a TTFCore.predict result on the board; `after` (the state once placed) updates hero badges. */
  B.preview = function preview(pred, after) {

    const here = st.pieces[slot];

      }

      if (card.kind === 'hero') tok += badgeHTML(C.formationStatus(st, slot, card.cond), st, 'ghost');
      if (here && here.kind === 'post') { cellEls[slot].classList.add('pvjoin'); tok += pipHTML(C.officerOf(here.officer), 'ghost'); }

  // ---- picking state, hit testing -----------------------------------------
  B.setPicking = function setPicking(slots) {
    const on = Array.isArray(slots);

    tileEls.forEach((t, i) => { t.classList.toggle('legal', on && slots.indexOf(i) >= 0); t.classList.remove('hot'); });
  };

    const r = el.getBoundingClientRect();
    if (x < r.left || y < r.top || x >= r.right || y >= r.bottom) return null;
    const c = Math.floor((x - r.left) / (r.width / N)), w = Math.floor((y - r.top) / (r.height / N));

  };

<script>
/*
 * core/js/hud.js - the top bar (enemy target, score bar, star row,
 * live total, turn pips, Restart and Undo), the side (generals / the chosen
 * general) and the tray (setup, offer cards, result plate)
 * (docs/P44-CORE.md §3). Builds DOM strings; app.js wires the events.
 *
 * globalThis.TTFHud = { top(st, ghostTotal?), side(st, sel), tray(st, ui), cardHTML(card, st) }
 */
(function () {
  const C = globalThis.TTFCore, Art = globalThis.TTFArt;
  const H = globalThis.TTFHud = {};
  const $ = (id) => document.getElementById(id);
  const tunOf = (st) => st.tun || C.TUN_DEFAULT;
  const NAMES = { inf: 'Infantry', arc: 'Archers', cav: 'Cavalry' };
  const genById = (id) => C.GENERALS.find((g) => g.id === id);

  // ---- top bar ---------------------------------------------------------------
  let shownTotal = null;
  H.top = function top(st, ghost) {
    const T = tunOf(st), tg = C.target(st);
    const tot = st.phase === 'setup' ? 0 : C.total(st);
    $('tgtNum').textContent = tg;
    $('tgtTier').textContent = st.tier[0].toUpperCase() + st.tier.slice(1);
    $('totTgt').textContent = tg;
    const max = tg; // the bar's full length is the target; the fill caps there
    const pct = (v) => Math.max(0, Math.min(100, (v / max) * 100));
    const bar = $('bar');
    bar.querySelector('.fill').style.width = 'calc(' + pct(tot) + '% - 4px)';
    bar.classList.toggle('over', tot > tg);
    const gh = bar.querySelector('.gh');
    gh.className = 'gh';
    const nx = $('totNext');
    nx.className = 'next'; nx.textContent = '';
    if (typeof ghost === 'number' && ghost !== tot) {
      const lo = Math.min(tot, ghost), hi = Math.max(tot, ghost);
      gh.classList.add(ghost > tot ? 'up' : 'down');
      gh.style.left = 'calc(' + pct(lo) + '% + 2px)';
      gh.style.width = 'calc(' + (pct(hi) - pct(lo)) + '% - 2px)';
      nx.classList.add(ghost > tot ? 'up' : 'down');
      nx.textContent = '→' + ghost;
    } else if (typeof ghost === 'number') {
      nx.textContent = '→' + ghost; nx.classList.add('same'); // a move that adds nothing: neutral
    }

    // (the thresholds are the battle tier's own, §7.7)
    let nh = '';
    C.starThresholds(st).forEach((need) => {
      const on = tot >= need, gon = !on && typeof ghost === 'number' && ghost >= need;
      nh += '<div class="sr' + (on ? ' on' : '') + (gon ? ' ghost' : '') + '">' + Art.star() + '<i>' + need + '</i></div>';
    });
    $('starRow').innerHTML = nh;
    // total (count up)
    const tb = $('totNum');
    if (shownTotal !== null && shownTotal !== tot && st.phase !== 'setup') {
      const from = shownTotal, t0 = performance.now();
      const step = (now) => { const k = Math.min(1, (now - t0) / 420); tb.textContent = Math.round(from + (tot - from) * k); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
      const box = tb.parentNode; box.classList.remove('bump'); void box.offsetWidth; box.classList.add('bump');
    } else tb.textContent = tot;
    shownTotal = tot;
    // turn pips
    let ph = '';
    for (let k = 0; k < T.turns; k++) ph += '<i class="pip8' + (k < st.turn ? ' done' : '') + (st.phase === 'draft' && k === st.turn ? ' now' : '') + '"></i>';
    $('pips').innerHTML = ph;
    $('bUndo').disabled = !st.prev;

  };
  H.resetCount = () => { shownTotal = null; };

  // ---- side ------------------------------------------------------------------
  function genCard(g, cls, T) {
    return '<button class="gen ' + (cls || '') + '" data-gen="' + g.id + '"><div class="coin">' + Art.emblem(g.id) + '</div>' +
      '<div class="txt"><div class="nm">' + g.name + '</div>' + Art.glyph(g.id, T) + '<div class="cap">' + g.short + '</div></div></button>';
  }
  H.side = function side(st, sel) {
    const el = $('side');
    if (st.phase === 'setup') {
      el.className = 'pick' + (sel.general ? ' has' : '');
      el.innerHTML = st.generalOffer.map((id) => genCard(genById(id), id === sel.general ? 'sel' : '', tunOf(st))).join('');
      return;
    }
    el.className = 'chosen';
    const army = (tunOf(st).armies || C.ARMIES).find((a) => a.id === st.army);
    const mx = Math.max(army.mix.inf, army.mix.arc, army.mix.cav), even = army.mix.inf === army.mix.arc && army.mix.arc === army.mix.cav;
    el.innerHTML = genCard(genById(st.general), 'chosen', tunOf(st)) +
      '<div class="armytag" title="' + army.name + '">' + ['inf', 'arc', 'cav'].map((t) => '<span class="' + (!even && army.mix[t] === mx ? 'main' : '') + '">' + Art.icon(t) + army.mix[t] + '</span>').join('') + '</div>' +
      '<div class="fkey" id="fkey"></div>';
    keyShown = null;
    H.key(st);
  };

  // ---- formation key ------------------------------------------------------------
  // The reference strip printed on the board's edge: a line of three of a kind and a
  // triad, each with its bonus (general-aware). An entry lights up with xN while that
  // formation stands on the board, and pulses while the held card would complete one.
  let keyShown = null; // {el, html}: skip identical rewrites so the pulse runs smoothly
  const bboxKey = (slots) => {
    const xs = slots.map((s) => s % 4), ys = slots.map((s) => (s / 4) | 0);
    return Math.min.apply(null, xs) + ',' + Math.min.apply(null, ys) + ',' + Math.max.apply(null, xs) + ',' + Math.max.apply(null, ys);
  };
  /** Lines on the board, and triads counted once per 2x2 square (as the board draws them). */
  function comboCount(cs) {
    const n = { line: 0, triad: 0 }, sq = {};
    for (const c of cs) {
      if (c.kind === 'line') n.line++;
      else { const k = bboxKey(c.slots); if (!sq[k]) { sq[k] = 1; n.triad++; } }
    }
    return n;
  }
  const kpip = (t) => '<span class="kp ' + t + '">' + Art.icon(t) + '</span>';
  /**
   * pred: a TTFCore.predict result being previewed (or none); after: the state once it is placed.
   */
  H.key = function key(st, pred, after) {
    const el = $('fkey');
    if (!el || st.phase === 'setup') return;
    const T = tunOf(st);
    const val = {
      line: st.general === 'iron_marshal' ? T.general.iron_marshal : T.combo.line,
      triad: st.general === 'tactician' ? T.general.tactician : T.combo.triad
    };
    const now = C.combosOf(st);
    const pulse = { line: null, triad: false };
    if (pred) for (const c of pred.newCombos) { if (c.kind === 'line') pulse.line = pulse.line || c.type; else pulse.triad = true; }
    const cnt = comboCount(pred && after ? C.combosOf(after) : now);
    const firstLine = now.find((c) => c.kind === 'line');
    const lt = pulse.line || (firstLine && firstLine.type) || 'inf';
    const entry = (kind, diagram, on, pl) =>
      '<div class="ke ' + kind + (on ? ' on' : '') + (pl ? ' pulse' : '') + '">' + diagram +
      '<span class="kv"><b>+' + val[kind] + '</b>' + (cnt[kind] ? '<i class="kn">×' + cnt[kind] + '</i>' : '') + '</span></div>';
    const lineD = '<div class="kd kl"><i class="kband ' + lt + '"></i>' + kpip(lt) + kpip(lt) + kpip(lt) + '</div>';
    const triD = '<div class="kd kt"><svg class="ktri" viewBox="0 0 2 2" aria-hidden="true"><polygon points=".5,.5 1.5,.5 .5,1.5"/></svg>' +
      kpip('inf') + kpip('arc') + kpip('cav') + '<span class="kp none"></span></div>';
    const html = entry('line', lineD, cnt.line > 0, !!pulse.line) + entry('triad', triD, cnt.triad > 0, pulse.triad);
    if (keyShown && keyShown.el === el && keyShown.html === html) return;
    el.innerHTML = html;
    keyShown = { el, html };
  };

  // ---- cards -----------------------------------------------------------------
  H.cardHTML = function cardHTML(card, st) {
    const T = tunOf(st);
    if (card.kind === 'unit') {
      // §7.9: the terrains that change this unit's value, from the engine (general-aware)
      const mods = C.terrainMods(st, card.type);
      const row = Object.keys(mods).sort((a, b) => mods[b] - mods[a]).map((t) => {
        const n = mods[t];
        return '<span class="tm ' + (n > 0 ? 'up' : 'dn') + '">' + Art.terrainIcon(t) + '<b>' + (n > 0 ? '+' + n : '−' + -n) + '</b></span>';
      }).join('');
      return '<div class="big"><div class="tok ' + card.type + '">' + Art.icon(card.type) + '</div></div>' +
        (row ? '<div class="trow">' + row + '</div>' : '') + '<div class="nm">' + NAMES[card.type] + '</div>';
    }
    if (card.kind === 'officer') {
      // §7.4: the shape on a mini 4x4 board (officer cell marked, covered cells in its
      // type colour) and the two numbers: host +N, its type inside the shape +N.
      const o = C.officerOf(card), cap = st.general === 'captain';
      const host = cap ? T.general.captain : T.officer.host, adj = cap ? T.general.captain : T.officer.adj;
      const home = Art.SHAPE_HOME[o.shape] !== undefined ? Art.SHAPE_HOME[o.shape] : 5;
      const cells = C.shapeCells(o.shape, home);
      let g = '';
      for (let k = 0; k < 16; k++) g += k === home ? '<i class="host">' + Art.officerIcon() + '</i>' : cells.indexOf(k) >= 0 ? '<i class="arm"></i>' : '<i></i>';
      return '<div class="sd">' + g + '</div>' +
        '<div class="ob"><span class="k host">' + Art.officerIcon() + '</span><b>+' + host + '</b>' +
        '<span class="k cu ' + o.type + '">' + Art.icon(o.type) + '</span><b>+' + adj + '</b></div><div class="nm">Officer</div>';
    }
    // hero
    const r = Math.min(2, st.general === 'warden' ? T.general.warden : T.hero.radius), n = 2 * r + 1;
    // Warden with wardenFar: only the inner ring takes the condition bonus, so it is drawn brighter.
    const inner = st.general === 'warden' && T.general.wardenFar && r > T.hero.radius ? T.hero.radius : -1;
    let g = '';
    for (let k = 0; k < n * n; k++) {
      const d = Math.max(Math.abs(k % n - r), Math.abs(((k / n) | 0) - r));
      g += d === 0 ? '<i class="c"><span class="htok">' + Art.heroIcon() + '</span></i>'
        : d <= inner ? '<i style="background:rgba(231,191,92,.65)"></i>' : '<i></i>';
    }
    let cond = '';
    ['inf', 'arc', 'cav'].forEach((t) => { for (let k = 0; k < ((card.cond || {})[t] || 0); k++) cond += '<span class="cu ' + t + '">' + Art.icon(t) + '</span>'; });
    // §7.3: no individual names; every such card is a "Formation" (the user's word).
    return '<div class="ringd r' + r + '">' + g + '<b>+' + T.hero.ring + '</b></div>' +
      '<div class="cond">' + cond + '<span class="arrow">→</span><i class="rg"></i><b>+' + T.hero.ringMet + '</b></div>' +
      '<div class="nm">Formation</div>';
  };
  function cardCls(card) { return 'card ' + card.kind + ' ' + (card.kind === 'hero' ? 'hero' : card.type); }

  // ---- tray ------------------------------------------------------------------
  /** ui: {sel:{general,army}, selected: offer index|null, deal: bool} */
  H.tray = function tray(st, ui) {
    const el = $('tray');
    const T = tunOf(st);
    if (st.phase === 'setup') {
      el.className = 'setup';
      const armies = T.armies || C.ARMIES;
      let a = '<div class="armies' + (ui.sel.army ? ' has' : '') + '">';
      armies.forEach((ar) => {
        const mx = Math.max(ar.mix.inf, ar.mix.arc, ar.mix.cav), even = ar.mix.inf === ar.mix.arc && ar.mix.arc === ar.mix.cav;
        a += '<button class="banner ' + ar.id + (ui.sel.army === ar.id ? ' sel' : '') + '" data-army="' + ar.id + '"><span class="nm">' + ar.name + '</span>' +
          ['inf', 'arc', 'cav'].map((t) => '<span class="row' + (!even && ar.mix[t] === mx ? ' main' : '') + '">' + Art.icon(t) + ar.mix[t] + '</span>').join('') + '</button>';
      });
      a += '</div>';
      const tiers = '<div class="tiers">' + ['easy', 'normal', 'hard'].map((t) => '<button data-tier="' + t + '" class="' + (st.tier === t ? 'sel' : '') + '"><span>' + t[0].toUpperCase() + t.slice(1) + '</span><b>' + T.target[t] + '</b></button>').join('') + '</div>';
      const ready = !!(ui.sel.general && ui.sel.army);
      const go = '<button class="go' + (ready ? ' ready' : '') + '" id="bBegin"' + (ready ? '' : ' disabled') + '><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#u-swords"/></svg>Begin</button>';
      el.innerHTML = '<div class="setupcol">' + a + tiers + go + '</div>';
      return;
    }
    if (st.phase === 'draft') {
      el.className = 'cards';
      el.innerHTML = st.offer.map((card, i) => {
        const ok = C.canPick(st, card);
        return '<div class="' + cardCls(card) + (ok ? '' : ' off') + (ui.selected === i ? ' sel' : '') + (ui.deal ? ' deal' : '') + '" data-oi="' + i + '" style="animation-delay:' + (i * 70) + 'ms">' + H.cardHTML(card, st) + '</div>';
      }).join('');
      return;
    }
    // done: the result plate
    el.className = 'result';
    const n = C.stars(st), tot = C.total(st), tg = C.target(st);
    let s = '';
    for (let k = 0; k < 3; k++) s += Art.star((k < n ? 'on' : '') + (k === 1 ? ' mid' : '')).replace('<svg ', '<svg style="animation-delay:' + (250 + k * 260) + 'ms" ');
    el.innerHTML = '<div class="plate"><div class="tierTag">' + st.tier[0].toUpperCase() + st.tier.slice(1) + '</div><div class="stars">' + s + '</div>' +
      '<div class="res"><b class="' + (n > 0 ? 'win' : 'lose') + '">' + tot + '</b><span>/ ' + tg + '</span></div>' +
      '<div class="acts"><button class="go" id="bAgain"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#u-restart"/></svg>Again</button>' +
      '<button class="go alt" id="bNew"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#u-swords"/></svg>New battle</button></div></div>';
  };
})();
</script>
<script>
/*
 * core/js/drag.js - one Pointer Events path for mouse, touch and pen
 * (docs/P44-CORE.md §3 Drag and drop). A press on an offer card that moves
 * past a small threshold becomes a drag: a floating copy follows the pointer
 * (lifted ~60px above a finger), the controller is told which slot is under
 * it, and a release places or springs back. A press that does not move is a
 * tap (select / deselect).
 *
 * globalThis.TTFDrag.init(trayEl, floatEl, cfg) with cfg = {
 *   canPick(i), isLegal(i, slot), slotAt(x, y), cellSize(), topLimit(),
 *   onStart(i), onMove(i, slot|null), onDrop(i, slot), onCancel(i), onTap(i) }
 */
(function () {
  const D = globalThis.TTFDrag = {};
  const LIFT = 60;
  let cfg = null, floatEl = null, drag = null;

  function hitPoint(e) {
    return { x: e.clientX, y: e.clientY - (drag && drag.type === 'touch' ? LIFT : 0) };
  }
  function placeFloat() {
    const d = drag, h = d.hit;
    let x = h.x, y = h.y;
    if (d.slot !== null) {
      // shrink above the slot so its preview shows; on the top row that would
      // cover the score bar, so the float steps out sideways instead
      const cs = cfg.cellSize(), fh = d.h * 0.45 / 2, fw = d.w * 0.45 / 2;
      if (y - cs * 0.78 - fh >= cfg.topLimit()) y -= cs * 0.78;
      else x += (d.slot % 4 < 2 ? -1 : 1) * (cs * 0.5 + fw + 6);
    }
    floatEl.style.transform = 'translate(' + (x - d.w / 2) + 'px,' + (y - d.h / 2) + 'px)';
  }

  function begin(e) {
    const d = drag;
    d.started = true;
    const r = d.el.getBoundingClientRect();
    d.w = r.width; d.h = r.height; d.home = { x: r.left, y: r.top };
    const clone = d.el.cloneNode(true);
    clone.classList.remove('sel', 'deal');
    clone.style.width = r.width + 'px'; clone.style.height = r.height + 'px';
    floatEl.className = '';
    floatEl.innerHTML = '';
    floatEl.appendChild(clone);
    d.el.classList.add('lifted');
    cfg.onStart(d.idx);
    move(e);
  }

  function move(e) {
    const d = drag;
    d.hit = hitPoint(e);
    const s = cfg.slotAt(d.hit.x, d.hit.y);
    const slot = s !== null && cfg.isLegal(d.idx, s) ? s : null;
    if (slot !== d.slot) { d.slot = slot; floatEl.classList.toggle('over', slot !== null); cfg.onMove(d.idx, slot); }
    placeFloat();
  }

  function finish(placeIt) {
    const d = drag;
    drag = null;
    if (!d) return;
    if (!d.started) { if (placeIt) cfg.onTap(d.idx); return; }
    d.el.classList.remove('lifted');
    if (placeIt && d.slot !== null) {
      floatEl.innerHTML = ''; floatEl.className = '';
      cfg.onDrop(d.idx, d.slot);
      return;
    }
    // spring back to the card's home
    floatEl.classList.remove('over');
    floatEl.classList.add('back');
    floatEl.style.transform = 'translate(' + d.home.x + 'px,' + d.home.y + 'px)';
    const done = () => { floatEl.innerHTML = ''; floatEl.className = ''; };
    floatEl.addEventListener('transitionend', done, { once: true });
    setTimeout(done, 420);
    cfg.onCancel(d.idx);
  }

  D.init = function init(trayEl, fl, c) {
    cfg = c; floatEl = fl;
    trayEl.addEventListener('pointerdown', (e) => {
      const el = e.target.closest('.card[data-oi]');
      if (!el || drag) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const idx = +el.dataset.oi;
      if (!cfg.canPick(idx)) return;
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* synthetic events */ }
      drag = { idx, el, id: e.pointerId, type: e.pointerType, x0: e.clientX, y0: e.clientY, started: false, slot: null, hit: null };
    });
    trayEl.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.started) {
        const th = drag.type === 'mouse' ? 6 : 10;
        if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < th) return;
        begin(e);
        return;
      }
      move(e);
    });
    trayEl.addEventListener('pointerup', (e) => { if (drag && e.pointerId === drag.id) { if (drag.started) move(e); finish(true); } });
    trayEl.addEventListener('pointercancel', (e) => { if (drag && e.pointerId === drag.id) finish(false); });
    trayEl.addEventListener('lostpointercapture', (e) => { if (drag && e.pointerId === drag.id && drag.started) finish(true); });
    // a tap on a card must not also count as a tap on empty space
    trayEl.addEventListener('click', (e) => { if (e.target.closest('.card[data-oi]')) e.stopPropagation(); });
  };
  D.active = () => !!(drag && drag.started);
})();
</script>
<script>
/*
 * core/js/app.js - the Core Battle controller (docs/P44-CORE.md §3): owns the
 * engine state, sizes the layout, wires setup / draft / end, the tap-select
 * fallback, hover previews and persistence (ttf-core:* keys only).
 */
(function () {
  const C = globalThis.TTFCore, Art = globalThis.TTFArt, Board = globalThis.TTFBoard;
  const Hud = globalThis.TTFHud, Drag = globalThis.TTFDrag;
  const $ = (id) => document.getElementById(id);

  // ---- persistence (ttf-core:* only, never trusted to exist) ------------------
  const LS = 'ttf-core:';
  const store = {
    get(k) { try { return window.localStorage.getItem(LS + k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(LS + k, v); } catch (e) { /* private mode */ } }
  };
  let tun = C.TUN_DEFAULT;
  try { const raw = store.get('tun'); if (raw) tun = C.mergeTun(C.TUN_DEFAULT, JSON.parse(raw)); } catch (e) { tun = C.TUN_DEFAULT; }
  const TIERS = ['easy', 'normal', 'hard'];
  let tier = store.get('tier');
  if (TIERS.indexOf(tier) < 0) tier = 'easy';

  function urlSeed() {
    try { const q = new URLSearchParams(window.location.search).get('seed'); return q === null || q === '' ? null : q; } catch (e) { return null; }
  }
  function setUrlSeed(seed) {
    try { window.history.replaceState(null, '', '?seed=' + encodeURIComponent(String(seed))); } catch (e) { /* file:// or sandbox */ }
  }

  // ---- state -----------------------------------------------------------------
  let st = null;
  const ui = { sel: { general: null, army: store.get('army') }, selected: null, deal: false, preview: null };

  /** keep: restart the same board with the same general and army (straight to the draft). */
  function newBattle(seed, keep) {
    const was = st && st.general ? { general: st.general, army: st.army } : null;
    st = C.createBattle({ seed: seed === null || seed === undefined ? undefined : seed, tier, tun });
    if (keep && was && st.generalOffer.indexOf(was.general) >= 0) {
      ui.sel.general = was.general; ui.sel.army = was.army;
      st = C.chooseSetup(st, was);
      ui.deal = true;
    }
    if (st.generalOffer.indexOf(ui.sel.general) < 0) ui.sel.general = null;
    if (!(tun.armies || C.ARMIES).some((a) => a.id === ui.sel.army)) ui.sel.army = null;
    ui.selected = null; ui.preview = null;
    setUrlSeed(st.seed);
    Hud.resetCount();
    render({});
    hint(st.phase === 'setup' ? 'setup' : 'draft');
  }

  // ---- hints -----------------------------------------------------------------
  // One parchment line at the board's top edge each time a battle starts: what to do
  // first. It fades on the first general / army pick, then on the first placement.
  // Non-blocking (pointer-events: none), nothing stored.
  const HINTS = { setup: 'Pick a general, army & difficulty to begin.', draft: 'Drag a card onto the field.' };
  let hintOn = null;
  function hint(kind) {
    const h = $('hint');
    if (!h) return;
    if (kind) {
      h.textContent = HINTS[kind];
      h.classList.remove('show'); void h.offsetWidth; h.classList.add('show');
    } else if (hintOn) h.classList.remove('show');
    hintOn = kind || null;
  }
  const dropHint = (kind) => { if (hintOn === kind) hint(null); };

  // ---- layout ----------------------------------------------------------------
  const cl = (a, v, b) => Math.max(a, Math.min(b, v));
  function layout() {
    const W = window.innerWidth, H = window.innerHeight, port = H > W * 1.05;
    const gap = Math.round(cl(8, Math.min(W, H) * 0.016, 16));
    const top = Math.round(cl(52, H * 0.08, 68));
    let side, tray, trayh, bs, cw, ch;
    if (!port) {
      side = Math.round(cl(108, W * 0.115, 160));
      tray = Math.round(cl(200, W * 0.215, 300));
      bs = Math.floor(Math.min(H - top - 2 * gap, W - side - tray - 4 * gap));
      trayh = bs; cw = tray; ch = Math.floor(Math.min((bs - 2 * gap) / 3, tray * 1.05));
    } else {
      trayh = Math.round(cl(210, H * 0.26, 300));
      bs = Math.floor(Math.min(W - 2 * gap, H - top - trayh - 3 * gap));
      side = Math.round(bs * (st && st.phase === 'setup' ? 0.4 : 0.24));
      tray = bs - side - gap;
      cw = Math.floor((tray - 2 * gap) / 3); ch = Math.floor(Math.min(trayh, cw * 1.55));
    }
    const frame = Math.round(bs * 0.028), cell = (bs - 2 * frame) / 4;
    const r = document.documentElement.style;
    const px = (n) => n + 'px';
    r.setProperty('--gap', px(gap)); r.setProperty('--top', px(top)); r.setProperty('--bs', px(bs));
    r.setProperty('--frame', px(frame)); r.setProperty('--cell', px(cell));
    r.setProperty('--side', px(side)); r.setProperty('--tray', px(tray)); r.setProperty('--trayh', px(trayh));
    r.setProperty('--cw', px(cw)); r.setProperty('--ch', px(ch)); r.setProperty('--cs', px(Math.min(cw, ch)));
    document.body.dataset.mode = port ? 'port' : 'land';
  }

  // ---- render ----------------------------------------------------------------
  function render(opts) {
    document.body.dataset.phase = st.phase;
    layout();
    Board.clear();
    Board.render(st, opts || {});
    Board.setPicking(null);
    Hud.top(st);
    Hud.side(st, ui.sel);
    Hud.tray(st, ui);
    ui.deal = false;
    if (ui.selected !== null) select(ui.selected);
  }

  // ---- selection and preview ---------------------------------------------------
  const legal = (i) => (st.phase === 'draft' && st.offer[i] ? C.legalSlots(st, st.offer[i]) : []);
  const pickable = (i) => st.phase === 'draft' && !!st.offer[i] && C.canPick(st, st.offer[i]);
  function markSel() {
    document.querySelectorAll('#tray .card[data-oi]').forEach((c) => c.classList.toggle('sel', +c.dataset.oi === ui.selected));
  }
  function select(i) {
    ui.selected = i;
    Board.focus(null);
    markSel();
    Board.setPicking(legal(i));
  }
  function deselect() {
    if (ui.selected === null) return;
    ui.selected = null;
    markSel();
    hidePreview();
    Board.setPicking(null);
  }
  function showPreview(i, slot) {
    if (ui.preview && ui.preview.i === i && ui.preview.slot === slot) return;
    const pred = C.predict(st, i, slot);
    if (!pred) { hidePreview(); return; }
    ui.preview = { i, slot, total: pred.totalAfter };
    const after = C.place(st, i, slot);
    Board.preview(pred, after);
    Board.setHot(slot);
    Hud.top(st, pred.totalAfter);
    Hud.key(st, pred, after);
  }
  function hidePreview() {
    if (!ui.preview) return;
    ui.preview = null;
    Board.clear();
    Board.setHot(null);
    Hud.top(st);
    Hud.key(st);
  }
  function doPlace(i, slot) {
    if (legal(i).indexOf(slot) < 0) return;
    ui.preview = null;
    ui.selected = null;
    st = C.place(st, i, slot);
    dropHint('draft');
    ui.deal = true;
    render({ fresh: slot, anim: true });
    if (st.phase === 'done') finish();
  }

  // ---- end -------------------------------------------------------------------
  function finish() {
    const n = C.stars(st);
    if (n > 0) {
      setTimeout(() => Board.flash(), 200);
      confetti(14 + n * 12);
    }
  }
  function confetti(count) {
    const box = $('confetti');
    const tr = $('tray').getBoundingClientRect();
    const cols = ['#e7bf5c', '#fbe7a6', '#c9a13a', '#f0e2bd', '#9b2529', '#5b82b5', '#4f8c5f'];
    let h = '';
    for (let k = 0; k < count; k++) {
      const x = tr.left + Math.random() * tr.width, dx = (Math.random() - 0.5) * 160;
      h += '<i style="left:' + x.toFixed(0) + 'px;background:' + cols[k % cols.length] + ';--dx:' + dx.toFixed(0) + 'px;--d:' + (1.4 + Math.random() * 1.2).toFixed(2) + 's;--r:' + (Math.random() * 900 - 450).toFixed(0) + 'deg;animation-delay:' + (300 + Math.random() * 500).toFixed(0) + 'ms;width:' + (5 + Math.random() * 5).toFixed(1) + 'px"></i>';
    }
    box.innerHTML = h;
    setTimeout(() => { box.innerHTML = ''; }, 3600);
  }

  // ---- wiring ----------------------------------------------------------------
  function wire() {
    const boardEl = Board.el();
    $('side').addEventListener('click', (e) => {
      const g = e.target.closest('[data-gen]');
      if (!g || st.phase !== 'setup') return;
      ui.sel.general = g.dataset.gen;
      dropHint('setup');
      Hud.side(st, ui.sel);
      Hud.tray(st, ui);
    });
    $('tray').addEventListener('click', (e) => {
      const a = e.target.closest('[data-army]'), t = e.target.closest('[data-tier]'), b = e.target.closest('button');
      if (st.phase === 'setup') {
        if (a) { ui.sel.army = a.dataset.army; store.set('army', ui.sel.army); dropHint('setup'); Hud.tray(st, ui); return; }
        if (t) {
          tier = t.dataset.tier; store.set('tier', tier);
          st = Object.assign({}, st, { tier });
          Hud.top(st); Hud.tray(st, ui);
          return;
        }
        if (b && b.id === 'bBegin' && ui.sel.general && ui.sel.army) {
          st = C.chooseSetup(st, { general: ui.sel.general, army: ui.sel.army });
          ui.deal = true;
          Hud.resetCount();
          render({});
          hint('draft');
        }
        return;
      }
      if (st.phase === 'done' && b) {
        if (b.id === 'bAgain') newBattle(st.seed, true);
        else if (b.id === 'bNew') newBattle(null);
      }
    });
    // Restart = back to general / army / difficulty select on the same board, last picks preselected.
    $('bRestart').addEventListener('click', () => { if (st.phase !== 'setup') newBattle(st.seed, false); });
    $('bUndo').addEventListener('click', () => {
      if (!st.prev) return;
      st = C.undo(st);
      ui.selected = null; ui.preview = null;
      render({});
    });

    // tap-select fallback: tap a slot to preview the selected card there, tap
    // it again to place (a mouse or pen has already previewed it by hovering)
    boardEl.addEventListener('click', (e) => {
      e.stopPropagation();
      if (ui.selected === null || Drag.active()) return;
      const s = Board.slotAt(e.clientX, e.clientY);
      if (s === null || legal(ui.selected).indexOf(s) < 0) { deselect(); return; }
      if (ui.preview && ui.preview.i === ui.selected && ui.preview.slot === s) doPlace(ui.selected, s);
      else showPreview(ui.selected, s);
    });
    // hover preview while a card is selected (mouse and pen); with no card selected,
    // hovering a placed officer or hero shows its area (§7.4)
    boardEl.addEventListener('pointermove', (e) => {
      if (Drag.active() || e.pointerType === 'touch') return;
      const s = Board.slotAt(e.clientX, e.clientY);
      if (ui.selected === null) { Board.focus(Board.hasArea(s) ? s : null); return; }
      if (s !== null && legal(ui.selected).indexOf(s) >= 0) showPreview(ui.selected, s);
      else hidePreview();
    });
    // (a finger "leaves" after every tap, which must not drop a tap preview)
    boardEl.addEventListener('pointerleave', (e) => { if (e.pointerType !== 'touch' && !Drag.active()) { hidePreview(); Board.focus(null); } });
    // touch: a long press (~350 ms) on a placed officer or hero shows its area until release
    let lp = null;
    const endPress = (e) => {
      if (!lp || (e && e.pointerId !== lp.id)) return;
      clearTimeout(lp.t);
      if (lp.on) Board.focus(null);
      lp = null;
    };
    boardEl.addEventListener('pointerdown', (e) => {
      if (e.pointerType !== 'touch' || ui.selected !== null || Drag.active()) return;
      const s = Board.slotAt(e.clientX, e.clientY);
      endPress();
      if (!Board.hasArea(s)) return;
      const press = { id: e.pointerId, x: e.clientX, y: e.clientY, on: false };
      press.t = setTimeout(() => { press.on = true; Board.focus(s); }, 350);
      lp = press;
    });
    boardEl.addEventListener('pointermove', (e) => {
      if (lp && e.pointerId === lp.id && !lp.on && Math.hypot(e.clientX - lp.x, e.clientY - lp.y) > 12) endPress(e);
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach((t) => boardEl.addEventListener(t, endPress));
    document.addEventListener('click', (e) => {
      if (ui.selected === null) return;
      if (e.target.closest('#tray .card[data-oi]')) return;
      deselect();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') deselect(); });

    Drag.init($('tray'), $('float'), {
      canPick: pickable,
      isLegal: (i, s) => legal(i).indexOf(s) >= 0,
      slotAt: Board.slotAt,
      cellSize: () => boardEl.getBoundingClientRect().width / 4,
      topLimit: () => $('top').getBoundingClientRect().bottom + 4,
      onStart(i) { ui.selected = null; markSel(); hidePreview(); Board.focus(null); Board.setPicking(legal(i)); },
      onMove(i, s) { if (s === null) { hidePreview(); Board.setHot(null); } else showPreview(i, s); },
      onDrop(i, s) { doPlace(i, s); },
      onCancel() { hidePreview(); Board.setPicking(null); },
      onTap(i) { if (ui.selected === i) deselect(); else { hidePreview(); select(i); } }
    });

    let rz = 0;
    window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layout); });
  }

  function boot() {
    Art.sheet();
    Board.mount($('board'));
    wire();
    newBattle(urlSeed());
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  // A read-only handle for tests and tools (never needed by the page itself).
  globalThis.TTFApp = { state: () => st, ui: () => ui, layout, hint: () => hintOn };
})();
</script>
</body>
</html>
